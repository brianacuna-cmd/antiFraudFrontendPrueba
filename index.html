<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antifraud Demo</title>
    <script>
      // Capture-phase: Vite's overlay listens later and would block Simulator Run.
      window.addEventListener(
        'error',
        function (event) {
          if (event.message && event.message.indexOf('ResizeObserver loop') !== -1) {
            event.stopImmediatePropagation()
            event.preventDefault()
          }
        },
        true,
      )
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
